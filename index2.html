<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Training&Job portal</title>
        <link rel="stylesheet" href="styleused/wholestyle.css" />
    </head>
    <body>
        <header>
            <h1 id="first_heading">ICT Training &job portal</h1>
            <p class="tagline">Learn.Build.Get Hired</p>
        </header>
        <section class="form-section">
            <h1>Student Registration</h1>
            <form>
                <label class="tagline">Full name</label>
                <input type="text" placeholder="Enter your name"/>
                <label>Email</label>
                <input type="email"placeholder="enter your email"/>
                <label>course Interested</label>
                <select>
                    <option> java full stack</option>
                    <option>frontend development</option>
                    <option>Backend development</option>
                </select>
                <button type="submit">Register</button>
            </form>
        </section>
    </body>
</html>
