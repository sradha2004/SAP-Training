<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF_8" />
        <meta name="viewport"  content="width=device-width , initial-scale=1.0" />
        <title> Job Portal </title>
        </head>
        <body>
            <h1>javaScript Event(job portal)</h1>
            <section>
                <h2>1. Button click Events</h2>
                <p>click the button to apply for a job</p>
                <button onclick="applyJob()">ApplyNow</button>
                <div id="applyResult" class="output"></div>
            </section>
            <section>
                <h2>2.Event Listener(Recommended way)</h2>
                <p>select your experience:</p>
                <select id="experience">
                    <option value="">----select----</option>
                    <option value="Fresher">Fresher</option>
                    <option value="1-3 years">1-3years</option>
                    <option value="3+years">3+years</option>
                </select>
                <div id="expResult" class="output"></div>
            </section>
            <section>
                <h2>3.form submit prevention</h2>
                <p>job application form</p>
                <form id="jobForm">
                    <input type="text" id="name" placeholder="your name" required/><br/>
                    <input
                    type="email" id="email" placeholder="email address" required/><br/>
                    <button type="submit">submit application</button>
                </form>
                <div id="formResult" class="output"></div>
            </section>
            <script>
                function applyJob(){
                    document.getElementById("applyResult").innerText="Application submitted successfully!";
                }
                document
                .getElementById("experience")
                .addEventListener("changer",function(){
                    document.getElementById("expResult").innerText="experience selected:"+this.value;
                });
                document
                .getElementById("jobform")
                .addEventListener("submit,")
            </script>
        </body>
        </html>
